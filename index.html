<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Entry-bundle recovery guard.
      //
      // Every page is code-split and the app ships as an auto-updating PWA, so a
      // tab (or the service worker's precache) can still hold an index.html that
      // points at a hashed /assets/index-*.js bundle a later deploy has removed.
      // Firebase Hosting rewrites the missing bundle to /index.html, so the
      // entry <script type="module"> receives HTML and the browser aborts with
      // "Failed to load module script: Expected a JavaScript-or-Wasm module
      // script but the server responded with a MIME type of text/html." React
      // never mounts, so lazyWithRetry and the ErrorBoundary can't help here.
      //
      // We catch that specific failure, purge the service worker + caches so the
      // stale index.html can't be served again, and reload to pull the fresh
      // index.html + chunk manifest from the network. A sessionStorage guard
      // keeps this to a single reload so a genuinely broken deploy can't loop.
      (function () {
        var RELOAD_KEY = "pitstopiq:entry-reload";
        window.addEventListener(
          "error",
          function (event) {
            var el = event && event.target;
            if (!el) return;
            // The stale bundle can surface either on the entry module <script>
            // or on one of its statically-imported <link rel="modulepreload">
            // dependencies (e.g. firebase-*.js, firestoreWrite-*.js) — both mean
            // index.html points at hashed assets the current deploy removed.
            var isModuleScript = el.tagName === "SCRIPT" && el.type === "module";
            var isModulePreload =
              el.tagName === "LINK" && el.rel === "modulepreload";
            if (!isModuleScript && !isModulePreload) return;
            if (window.sessionStorage.getItem(RELOAD_KEY)) return;
            window.sessionStorage.setItem(RELOAD_KEY, "1");
            var reload = function () {
              window.location.reload();
            };
            var jobs = [];
            try {
              if ("serviceWorker" in navigator) {
                jobs.push(
                  navigator.serviceWorker
                    .getRegistrations()
                    .then(function (regs) {
                      return Promise.all(
                        regs.map(function (r) {
                          return r.unregister();
                        })
                      );
                    })
                    .catch(function () {})
                );
              }
              if (window.caches && caches.keys) {
                jobs.push(
                  caches
                    .keys()
                    .then(function (keys) {
                      return Promise.all(
                        keys.map(function (k) {
                          return caches.delete(k);
                        })
                      );
                    })
                    .catch(function () {})
                );
              }
              Promise.all(jobs)
                .catch(function () {})
                .then(reload);
            } catch (_) {
              reload();
            }
          },
          true // capture: resource load errors don't bubble
        );
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1120" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>PitstopIQ</title>
    <!-- Multilingual web fonts: Latin + Sinhala + Tamil.
         Loaded by script rather than as a plain <link> for two reasons, both of
         which showed up as a slow first paint on mid-range Android phones:

         1. A stylesheet <link> in the head blocks rendering until it comes
            back. Requesting it with media="print" and flipping to "all" on load
            makes it non-blocking — index.css already names system fallbacks, so
            text appears immediately and swaps when Inter arrives.
         2. Only the script the user actually reads in is requested. Sinhala and
            Tamil faces are fetched when that language is selected, not on every
            English device.

         The weights are asked for as a range (400..800) so Google serves ONE
         variable font file per script instead of five static instances. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      (function () {
        var FAMILY = { si: "Noto+Sans+Sinhala", ta: "Noto+Sans+Tamil" };
        var lang;
        try {
          lang = window.localStorage.getItem("pitstopiq.lang");
        } catch (_) {
          lang = null;
        }
        var families = ["family=Inter:wght@400..800"];
        if (FAMILY[lang]) {
          families.push("family=" + FAMILY[lang] + ":wght@400..800");
          // Tells src/i18n.ts this script's face is already on its way, so it
          // doesn't request the same font a second time on start-up.
          document.documentElement.setAttribute("data-script-font", lang);
        }
        var link = document.createElement("link");
        link.rel = "stylesheet";
        link.href =
          "https://fonts.googleapis.com/css2?" + families.join("&") + "&display=swap";
        // Non-blocking: fetched at low priority, applied once it lands.
        link.media = "print";
        link.onload = function () {
          this.media = "all";
        };
        document.head.appendChild(link);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
